---
argument_specs:
  main:
    short_description: Set up open-iscsi, and log in to iSCSI targets at once and at boot.
    description:
      - Installs open-iscsi, sets the initiator name and the iscsid settings, and enables iscsid and open-iscsi.
      - Discovers targets that have no node record yet, applies the iscsid node settings to their records, and logs in.
      - Optionally sets a longer command timeout on the disks of chosen SCSI vendors.
      - Runs multipathd, or stops and disables it.
      - Doesn't create file systems or mount anything.
    author:
      - pypb
    options:
      iscsi_initiator_packages:
        type: list
        elements: str
        default: [open-iscsi, lsscsi]
        description: Packages to install. C(multipath-tools) is added when O(iscsi_initiator_multipathd) is true.
      iscsi_initiator_name:
        type: str
        description:
          - The initiator name, which targets use to recognise the host.
          - Unset, it's C(iqn.2004-10.com.ubuntu:01:) on Ubuntu and C(iqn.1993-08.org.debian:01:) on Debian, followed by the short inventory host name.
          - An empty string keeps the name the package generated.
          - iscsid is restarted when it changes. Existing sessions stay up.
      iscsi_initiator_iscsid_settings:
        type: dict
        default:
          node.session.timeo.replacement_timeout: 600
          node.session.initial_login_retry_max: 20
        description:
          - Settings for C(/etc/iscsi/iscsid.conf).
          - The C(node.*) settings are also applied to the node records of O(iscsi_initiator_targets), and take effect at the next login.
      iscsi_initiator_start:
        type: bool
        default: true
        description:
          - Start iscsid, and multipathd when O(iscsi_initiator_multipathd) is true, and log in to the targets.
          - False enables them without starting them, and leaves the logins as they are, for example in a container or an image.
      iscsi_initiator_targets:
        type: list
        elements: dict
        default: []
        description: Targets to discover and log in to.
        options:
          target:
            type: str
            required: true
            description: IQN of the target.
          portal:
            type: str
            required: true
            description: Address of the portal.
          port:
            type: int
            default: 3260
            description: TCP port of the portal.
          login:
            type: bool
            default: true
            description: Be logged in to the target. False logs out of it.
          auto_node_startup:
            type: bool
            default: true
            description: Log in to the target at boot.
          auto_portal_startup:
            type: bool
            default: true
            description: Log in through this portal at boot.
      iscsi_initiator_device_vendors:
        type: list
        elements: str
        default: []
        description:
          - SCSI vendors, as in C(/sys/block/sdX/device/vendor), whose disks get O(iscsi_initiator_device_timeout).
          - The udev rule applies to disks as they're added, so at the next login or boot. It's removed when the list is empty.
      iscsi_initiator_device_timeout:
        type: int
        default: 600
        description: SCSI command timeout in seconds for the disks of O(iscsi_initiator_device_vendors).
      iscsi_initiator_multipathd:
        type: bool
        default: false
        description:
          - True installs multipath-tools, and enables and starts multipathd.
          - False stops and disables multipathd if it's installed. With a single path, it claims the disks without adding anything.
