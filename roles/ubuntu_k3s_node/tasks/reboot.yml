---
# The reboot entry point. A node that goes down with OCFS2 mounted holds cluster
# locks, and the other nodes block until they declare it dead. If it comes back
# before then, its mounts hang. k3s leaves its containers running when it stops, and
# they keep the file systems busy, so stop them and unmount first. A busy file system
# fails the play instead of rebooting.
#
# On a host without k3s and without file systems to unmount, this is a plain reboot.
- name: Check whether k3s is installed
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --value
      - "{{ ubuntu_k3s_node_k3s_service }}"
  register: __ubuntu_k3s_node_k3s_unit
  changed_when: false
  check_mode: false

- name: Stop k3s and its pods
  ansible.builtin.command:
    argv:
      - "{{ ubuntu_k3s_node_k3s_killall }}"
  changed_when: true
  when: __ubuntu_k3s_node_k3s_unit['stdout'] == 'loaded'

- name: Unmount the shared file systems
  ansible.posix.mount:
    path: "{{ item }}"
    state: unmounted
  loop: "{{ ubuntu_k3s_node_reboot_unmount_paths }}"

- name: Reboot the node
  ansible.builtin.reboot:
    msg: "{{ ubuntu_k3s_node_reboot_msg }}"
    post_reboot_delay: "{{ ubuntu_k3s_node_post_reboot_delay }}"

- name: Wait for the node to be Ready
  ansible.builtin.include_tasks: wait.yml
