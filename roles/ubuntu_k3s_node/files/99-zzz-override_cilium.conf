# Managed by Ansible (pypb.homelab.ubuntu_k3s_node).
# From the Cilium documentation: rp_filter can drop packets that Cilium has
# rewritten, so it is turned off for Cilium's interfaces.
-net.ipv4.conf.lxc*.rp_filter = 0
-net.ipv4.conf.cilium_*.rp_filter = 0
# The kernel uses the higher of the "all" and the interface value, so "all" has
# to be 0 as well, or it overrules the settings above.
net.ipv4.conf.all.rp_filter = 0
