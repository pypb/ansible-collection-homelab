---
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # Don't log these verbs.
  - level: None
    verbs:
      - get
      - list
      - watch
  # Don't log actions by these accounts.
  - level: None
    users:
      - system:kube-scheduler
      - system:apiserver
      - system:kube-controller-manager
  # Don't log actions by these groups.
  - level: None
    userGroups:
      - system:nodes
  # Log the rest at the Metadata level.
  - level: Metadata
