---
# Write and update the lists. False removes them, with the update script and
# its timer, and fails while haproxy_frontends, haproxy_backends,
# haproxy_listens, haproxy_global or haproxy_defaults still refer to
# haproxy_geoip_dir.
haproxy_geoip_enabled: false

# Country lists of IP prefixes for HAProxy, as a dict of list name and the
# countries' ISO codes. Each list is written to <haproxy_geoip_dir>/<name>.lst,
# for "src -f" in an ACL.
#
# The prefixes come from DB-IP's IP to Country Lite, which places addresses
# where they're used, rather than where the block is registered. IP
# Geolocation by DB-IP (https://db-ip.com), CC BY 4.0.
haproxy_geoip_lists: {}
#  web_allowed: [se, dk]

haproxy_geoip_dir: /etc/haproxy/geoip

# A directory on the controller with a <code>.lst per country, used for a
# country the host has never downloaded. Written with the role's
# files/haproxy_geoip_update.py --seeds. A country without a seed is
# downloaded while the role runs.
haproxy_geoip_seeds_dir: ""

# When to look for a new month of the database, as a systemd OnCalendar
# expression. A random delay of up to an hour is added. A month that has been
# applied isn't downloaded again, and a failed download is retried hourly,
# keeping the last good prefixes until then.
haproxy_geoip_on_calendar: daily

# A country with fewer IPv4 prefixes than this in a download, or with less
# than half as many as the last good one, keeps its last good prefixes.
haproxy_geoip_min_prefixes: 50
