---
# Lines of the global section, after the distribution's chroot, user, group
# and daemon. The stats socket's expose-fd listeners lets a reload keep the
# listening sockets.
haproxy_global: |
  log stdout format raw local0 notice
  stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
  stats timeout 30s

# Lines of the defaults section.
haproxy_defaults: |
  log     global
  mode    http
  option  httplog
  option  dontlognull
  timeout connect 5s
  timeout client  50s
  timeout server  50s
  errorfile 400 /etc/haproxy/errors/400.http
  errorfile 403 /etc/haproxy/errors/403.http
  errorfile 408 /etc/haproxy/errors/408.http
  errorfile 500 /etc/haproxy/errors/500.http
  errorfile 502 /etc/haproxy/errors/502.http
  errorfile 503 /etc/haproxy/errors/503.http
  errorfile 504 /etc/haproxy/errors/504.http

# Frontends, backends and listen sections, as dicts of section name and its
# lines.
haproxy_frontends: {}
haproxy_backends: {}
haproxy_listens: {}
