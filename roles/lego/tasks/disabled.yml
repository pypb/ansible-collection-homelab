---
- name: Find the service and timer
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ item }}
  loop: "{{ __lego_units }}"
  register: __lego_unit_files

# The timer first, so that it doesn't start the service again.
- name: Stop and disable the timer and service
  ansible.builtin.systemd_service:
    name: "{{ item['item'] }}"
    enabled: false
    state: stopped
  loop: "{{ __lego_unit_files['results'] | selectattr('stat.exists') | reverse | list }}"
  loop_control:
    label: "{{ item['item'] }}"

- name: Remove the service and timer
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item }}
    state: absent
  loop: "{{ __lego_units }}"
  notify: Reload systemd

# So that systemd forgets the units before the role ends.
- name: Reload systemd now
  ansible.builtin.meta: flush_handlers

- name: Remove the script and the provider's environment
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ __lego_script }}"
    - "{{ __lego_environment_file | dirname }}"
