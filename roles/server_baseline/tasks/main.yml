---
- name: Gather required facts
  ansible.builtin.setup:
    gather_subset: [min, virtual]
  when: __server_baseline_required_facts | difference(ansible_facts.keys() | list) | length > 0

- name: Validate the settings
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - __server_baseline_install | intersect(__server_baseline_purge) | length == 0
      - server_baseline_domain is match('^([A-Za-z0-9-]+\.)*[A-Za-z0-9-]*$')
      - server_baseline_nameservers | reject('match', '^[0-9A-Fa-f.:]+$') | length == 0
      - server_baseline_kernel_consoles | reject('match', '^[A-Za-z0-9,]+$') | length == 0
      - server_baseline_grub_terminals | reject('match', '^[a-z_]+$') | length == 0
      - server_baseline_grub_serial_command is match('^[A-Za-z0-9 =,._-]+$')
      - not (server_baseline_tmp_tmpfs | bool and __server_baseline_ubuntu | bool)
    fail_msg: >-
      This role supports Debian and Ubuntu only. A package can't be both installed and
      purged. server_baseline_domain must be a domain name, server_baseline_nameservers
      IP addresses, server_baseline_kernel_consoles devices such as ttyS0 or
      ttyS0,115200n8, server_baseline_grub_terminals GRUB terminal names, and
      server_baseline_grub_serial_command letters, digits, spaces and =,._-.
      server_baseline_tmp_tmpfs is for Debian only, since Ubuntu doesn't ship tmp.mount.
    quiet: true

- name: Manage packages
  ansible.builtin.include_tasks: packages.yml

- name: Set the host's domain name
  ansible.builtin.include_tasks: identity.yml
  when: server_baseline_domain | length > 0

# A container gets its resolv.conf from its host.
- name: Write a static resolv.conf
  ansible.builtin.include_tasks: dns.yml
  when:
    - server_baseline_nameservers | length > 0
    - not __server_baseline_lxc | bool

- name: Configure the system
  ansible.builtin.include_tasks: system.yml

- name: Configure the consoles and boot menu
  ansible.builtin.include_tasks: console.yml
