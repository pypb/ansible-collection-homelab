---
# Runs the generators again, for fstab, crypttab and the zram devices.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# A device that's already swap keeps its old settings until the next boot. In check
# mode, systemd hasn't been reloaded, so the swap units aren't there yet.
- name: Start the zram swap
  ansible.builtin.systemd_service:
    name: dev-zram0.swap
    state: started
  when:
    - not __swap_container | bool
    - not ansible_check_mode
    - "'/dev/zram0' not in __swap_active"

- name: Start the encrypted swap
  ansible.builtin.systemd_service:
    name: "dev-mapper-{{ swap_encrypted_name }}.swap"
    state: started
  when:
    - not __swap_container | bool
    - not ansible_check_mode
    - not __swap_encrypted_open['stat']['exists']

# Applies only the role's file.
- name: Apply the sysctl settings
  ansible.builtin.command:
    argv: [/usr/lib/systemd/systemd-sysctl, "/etc/sysctl.d/{{ swap_sysctl_file }}"]
  changed_when: true
  when: not __swap_container | bool
