---
# The Compose project's directory. Its name is the project's, and prefixes the
# names of the volumes.
docker_traefik_dir: /srv/docker/traefik

# The group that owns the directory and the configuration, so that its members
# can read them without root.
docker_traefik_group: docker

docker_traefik_image: traefik:v3.7

# Published ports, in Compose's short syntax.
docker_traefik_ports:
  - "80:80"
  - "443:443"

# More volumes of the container, in Compose's short syntax. Relative paths are
# relative to docker_traefik_dir.
docker_traefik_volumes: []

# Environment variables, written to the Compose file.
docker_traefik_environment: {}

# Environment variables for secrets, such as DNS API tokens, written to .env,
# which only root can read.
docker_traefik_secret_environment: {}

# The static configuration, written to /etc/traefik/traefik.yml in the
# container. Changing it restarts Traefik. The role always sets
# providers.file to read the dynamic configuration.
docker_traefik_static_config:
  global:
    checkNewVersion: false
    sendAnonymousUsage: false
  log:
    level: INFO
  providers:
    docker:
      exposedByDefault: false
  entryPoints:
    web:
      address: ":80"
    websecure:
      address: ":443"

# Merged recursively over docker_traefik_static_config, for additions on some
# hosts.
docker_traefik_static_config_extra: {}

# Files of dynamic configuration, as a dict of file name and content. Traefik
# reloads them without a restart, and files that aren't listed are removed.
docker_traefik_dynamic_config: {}
