---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ansible-core ansible-lint yamllint
      - run: yamllint .
      - run: ansible-lint

  sanity:
    runs-on: ubuntu-latest
    steps:
      # ansible-test only runs from a path ending in
      # ansible_collections/<namespace>/<name>.
      - uses: actions/checkout@v7
        with:
          path: ansible_collections/pypb/homelab
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ansible-core
      # Not --docker, because its container setup fails on the GitHub runner when
      # remounting /sys/fs/cgroup.
      - run: ansible-test sanity --venv --python 3.14 --requirements
        working-directory: ansible_collections/pypb/homelab

  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - restic_server_users
          - restic_backup
          - smtp_client
          - acme_certificates
          - ubuntu_k3s_node
          - ocfs2
          - iscsi_initiator
          - server_baseline
          - unattended_upgrades
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ansible_collections/pypb/homelab
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ansible-core molecule requests
      - run: ansible-galaxy collection install ansible.posix community.docker community.crypto community.general
      - run: molecule test --scenario-name ${{ matrix.scenario }}
        working-directory: ansible_collections/pypb/homelab/extensions

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ansible-core
      - run: ansible-galaxy collection build
