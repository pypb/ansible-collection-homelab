---
- name: Converge
  hosts: localhost
  gather_facts: false
  vars:
    restic_server_users_host: localhost
    restic_server_users_container: molecule-rest-server
  tasks:
    - name: Manage rest-server users
      ansible.builtin.include_role:
        name: pypb.homelab.restic_server_users
      vars:
        restic_server_users_list:
          - name: generated-user
          - name: explicit-user
            password: explicit-password
          - name: never-existed
            state: absent
