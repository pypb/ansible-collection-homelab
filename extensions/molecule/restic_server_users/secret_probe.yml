---
- name: Run the role with a known secret, for inspecting its output
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Manage rest-server user
      ansible.builtin.include_role:
        name: pypb.homelab.restic_server_users
      vars:
        restic_server_users_host: localhost
        restic_server_users_container: molecule-rest-server
        restic_server_users_list:
          - name: probe-user
            password: probe-secret-value
            update_password: always
          - name: probe-generated
