---
- name: Prepare rest-server
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Start rest-server container
      community.docker.docker_container:
        name: molecule-rest-server
        image: docker.io/restic/rest-server:0.14.0
        state: started
        published_ports:
          - 127.0.0.1:18000:8000

    - name: Wait for rest-server
      ansible.builtin.uri:
        url: http://127.0.0.1:18000/
        status_code: 401
      register: __molecule_rest_server
      until: __molecule_rest_server['status'] == 401
      retries: 30
      delay: 1
