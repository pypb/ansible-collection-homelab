---
platforms:
  - name: localhost

provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          localhost:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
            __molecule_state: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/kube"
            restic_k8up_users_kubectl:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/fake_kubectl.py"
              - "{{ __molecule_state }}"
            restic_k8up_users_server_host: rest.example.test
            restic_k8up_users_report_prefix: k8up-test-
            restic_server_users_host: localhost
            restic_server_users_container: molecule-k8up-rest-server
  config_options:
    defaults:
      collections_path: ${ANSIBLE_COLLECTIONS_PATH}

scenario:
  test_sequence:
    - destroy
    - prepare
    - check
    - converge
    - idempotence
    - verify
    - destroy
