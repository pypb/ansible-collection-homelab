---
- name: Read the Secret
  ansible.builtin.slurp:
    src: "{{ __molecule_state }}/secrets/{{ secret_file }}"
  register: __molecule_secret

- name: Check the Secret holds the user
  ansible.builtin.assert:
    that:
      - (__molecule_secret['content'] | b64decode | from_json)['data'][secret_username_key] | b64decode == secret_user
      - >-
        (__molecule_secret['content'] | b64decode | from_json)['metadata']['labels']['app.kubernetes.io/managed-by']
        == 'ansible-restic_k8up_users'

- name: Check the Secret's password works
  ansible.builtin.include_tasks: check_login.yml
  vars:
    login_user: "{{ secret_user }}"
    login_password: "{{ (__molecule_secret['content'] | b64decode | from_json)['data'][secret_password_key] | b64decode }}"
    login_rejected: false
