---
platforms:
  - name: iscsi-debian13
    image: docker.io/library/debian:13
  - name: iscsi-ubuntu2404
    image: docker.io/library/ubuntu:24.04
  - name: iscsi-ubuntu2604
    image: docker.io/library/ubuntu:26.04

provisioner:
  name: ansible
  inventory:
    hosts:
      controller:
        hosts:
          molecule-host:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      targets:
        hosts:
          iscsi-debian13:
            ansible_connection: community.docker.docker
            ansible_user: root
          iscsi-ubuntu2404:
            ansible_connection: community.docker.docker
            ansible_user: root
          iscsi-ubuntu2604:
            ansible_connection: community.docker.docker
            ansible_user: root
  config_options:
    defaults:
      collections_path: ${ANSIBLE_COLLECTIONS_PATH}
      host_key_checking: false
  playbooks:
    create: create.yml
    destroy: destroy.yml

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - check
    - converge
    - idempotence
    - verify
    - destroy
