---
platforms:
  - name: debian13
    image: docker.io/library/debian:13
  - name: ubuntu2404
    image: docker.io/library/ubuntu:24.04
  - name: ubuntu2604
    image: docker.io/library/ubuntu:26.04

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        restic_server_hostname: rest-server-host
        restic_server_container: molecule-restic-rest-server
        restic_backup_enable: true
        restic_backup_password: molecule-repository-password
        restic_backup_repo_url: "rest:http://molecule-restic-rest-server:8000/{{ inventory_hostname_short }}"
        restic_backup_schedule_enable: true
        restic_backup_include:
          - /etc/hostname
        restic_backup_profiles_host:
          system:
            inherit: defaults-files
            backup:
              schedule: "*-*-* 01:30:00"
    hosts:
      rest_server_hosts:
        hosts:
          rest-server-host:
            ansible_connection: local
            ansible_become: false
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
            restic_backup_enable: false
      targets:
        hosts:
          debian13:
            ansible_connection: community.docker.docker
            ansible_user: root
          ubuntu2404:
            ansible_connection: community.docker.docker
            ansible_user: root
          ubuntu2604:
            ansible_connection: community.docker.docker
            ansible_user: root
  config_options:
    defaults:
      collections_path: ${ANSIBLE_COLLECTIONS_PATH}
      host_key_checking: false
  playbooks:
    create: create.yml
    destroy: destroy.yml

scenario:
  test_sequence:
    - destroy
    - create
    - check
    - converge
    - idempotence
    - verify
    - destroy
