---
- name: Converge a proxy
  hosts: targets
  gather_facts: false
  tasks:
    - name: Run Traefik
      ansible.builtin.include_role:
        name: pypb.homelab.docker_traefik
      vars:
        docker_traefik_secret_environment:
          EXAMPLE_TOKEN: not-a-secret
        docker_traefik_static_config_extra:
          ping:
            entryPoint: web
          # The test's router goes to noop@internal, which is only logged
          # with addInternals.
          accessLog:
            filePath: /logs/access.log
            addInternals: true
        docker_traefik_dynamic_config:
          hello.yml:
            http:
              routers:
                hello:
                  rule: Path(`/hello`)
                  entryPoints:
                    - web
                  middlewares:
                    - hello
                  service: noop@internal
              middlewares:
                hello:
                  redirectRegex:
                    regex: ".*"
                    replacement: https://example.org/
