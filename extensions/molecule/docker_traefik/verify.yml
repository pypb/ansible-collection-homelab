---
- name: Verify the proxy
  hosts: targets
  gather_facts: false
  tasks:
    - name: Ping Traefik, which the static configuration enables
      ansible.builtin.uri:
        url: http://127.0.0.1/ping
        return_content: true
      register: __molecule_ping
      retries: 15
      delay: 2
      until: __molecule_ping is succeeded

    - name: Request the router of the dynamic configuration
      ansible.builtin.uri:
        url: http://127.0.0.1/hello
        follow_redirects: none
        status_code: [302, 307]
      register: __molecule_hello
      retries: 15
      delay: 2
      until: __molecule_hello is succeeded

    - name: Read the secret environment
      ansible.builtin.stat:
        path: /srv/docker/traefik/.env
      register: __molecule_env

    - name: Check Traefik answered, and the secrets are root's
      ansible.builtin.assert:
        that:
          - __molecule_ping['content'] == 'OK'
          - __molecule_hello['location'] == 'https://example.org/'
          - __molecule_env['stat']['mode'] == '0600'
          - __molecule_env['stat']['pw_name'] == 'root'

    - name: Find the logs volume
      ansible.builtin.command:
        argv: [docker, volume, inspect, --format, "{{ '{{' }} .Mountpoint {{ '}}' }}", traefik_logs]
      register: __molecule_logs
      changed_when: false

    - name: Rotate the log files now
      ansible.builtin.command:
        argv: [logrotate, --force, /etc/logrotate.d/traefik-traefik]
      changed_when: true

    - name: Wait for Traefik to reopen its log files, on USR1 from logrotate
      ansible.builtin.command:
        argv: [docker, logs, traefik-reverse-proxy-1]
      register: __molecule_traefik_log
      changed_when: false
      retries: 15
      delay: 1
      until: "'re-opening log files' in __molecule_traefik_log['stdout'] ~ __molecule_traefik_log['stderr']"

    - name: Request the router again, after the rotation
      ansible.builtin.uri:
        url: http://127.0.0.1/hello
        follow_redirects: none
        status_code: [302, 307]

    - name: Read the access log after the rotation
      ansible.builtin.slurp:
        src: "{{ __molecule_logs['stdout'] }}/access.log"
      register: __molecule_access_log

    - name: Find the rotated access log
      ansible.builtin.stat:
        path: "{{ __molecule_logs['stdout'] }}/access.log.1"
      register: __molecule_rotated

    - name: Check the log was rotated, and Traefik writes to a new one
      ansible.builtin.assert:
        that:
          - __molecule_rotated['stat']['exists']
          - "'/hello' in __molecule_access_log['content'] | b64decode"

    - name: Leave a file in the dynamic configuration that isn't listed
      ansible.builtin.copy:
        content: "{}\n"
        dest: /srv/docker/traefik/conf/dynamic/stale.yml
        mode: "0640"

    - name: Run Traefik without the router
      ansible.builtin.include_role:
        name: pypb.homelab.docker_traefik
      vars:
        docker_traefik_static_config_extra:
          ping:
            entryPoint: web

    - name: Find the dynamic configuration files
      ansible.builtin.find:
        paths: /srv/docker/traefik/conf/dynamic
        hidden: true
      register: __molecule_dynamic

    - name: Request the removed router
      ansible.builtin.uri:
        url: http://127.0.0.1/hello
        follow_redirects: none
        status_code: 404
      register: __molecule_removed
      retries: 15
      delay: 2
      until: __molecule_removed is succeeded

    - name: Check the files that weren't listed were removed
      ansible.builtin.assert:
        that: __molecule_dynamic['files'] | length == 0
