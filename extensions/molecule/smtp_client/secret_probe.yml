---
- name: Run the role with a known secret, for inspecting its output
  hosts: smtp-client-debian13
  gather_facts: false
  tasks:
    - name: Configure msmtp
      ansible.builtin.include_role:
        name: pypb.homelab.smtp_client
      vars:
        smtp_client_relay_host: relay.example.com
        smtp_client_relay_user: probe-user
        smtp_client_relay_password: probe-secret-value
