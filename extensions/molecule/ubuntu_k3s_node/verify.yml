---
- name: Verify a server prepared for Cilium
  hosts: targets
  gather_facts: false
  tasks:
    - name: Read package facts
      ansible.builtin.package_facts:

    - name: Check packages were installed and purged
      ansible.builtin.assert:
        that:
          - "'nfs-common' in ansible_facts['packages']"
          - "'motd-news-config' not in ansible_facts['packages']"
          - "'ocfs2-tools' in ansible_facts['packages']"
          - "'open-iscsi' in ansible_facts['packages']"

    - name: Read unit states
      ansible.builtin.command:
        argv: [systemctl, is-enabled, apt-daily.timer, molecule-missing.service]
      register: __molecule_unit_states
      changed_when: false
      failed_when: false

    - name: Read whether the masked timer runs
      ansible.builtin.command:
        argv: [systemctl, is-active, apt-daily.timer]
      register: __molecule_unit_active
      changed_when: false
      failed_when: false

    - name: Check units are masked, including ones that don't exist, and stopped
      ansible.builtin.assert:
        that:
          - __molecule_unit_states['stdout_lines'] == ['masked', 'masked']
          - __molecule_unit_active['stdout'] in ['inactive', 'failed']

    - name: Read applied kernel settings
      ansible.builtin.slurp:
        src: "/proc/sys/net/ipv4/{{ item }}"
      loop:
        - tcp_keepalive_time
        - conf/all/rp_filter
        - tcp_fin_timeout
      register: __molecule_sysctl

    - name: Check the sysctl settings were applied
      ansible.builtin.assert:
        that:
          - __molecule_sysctl['results'] | map(attribute='content') | map('b64decode') | map('trim') | list
            == ['600', '0', '30']

    # k3s isn't installed, so the role created the server directory.
    - name: Read the k3s server directory
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server
      register: __molecule_server_dir

    - name: Check the k3s server directory is private
      ansible.builtin.assert:
        that: __molecule_server_dir['stat']['mode'] == '0700'

    - name: Read the written files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/modprobe.d/blacklist-unused-storage.conf
        - /etc/modules-load.d/cilium.conf
        - /etc/k8s/resolv.conf
        - /var/lib/rancher/k3s/server/psa.yaml
        - /var/lib/rancher/k3s/server/audit.yaml
      register: __molecule_files

    - name: Check the written files
      ansible.builtin.assert:
        that:
          - __blacklist is search('^blacklist btrfs$', multiline=true)
          - __modules is search('^xt_TPROXY$', multiline=true)
          - __resolv is search('^nameserver 192.0.2.53\nnameserver 192.0.2.54\n', multiline=true)
          - __psa['plugins'][0]['configuration']['exemptions']['namespaces'] == ['kube-system', 'molecule-system']
          - __psa['plugins'][0]['configuration']['defaults']['enforce'] == 'privileged'
          - __audit['kind'] == 'Policy'
      vars:
        __contents: "{{ __molecule_files['results'] | map(attribute='content') | map('b64decode') | list }}"
        __blacklist: "{{ __contents[0] }}"
        __modules: "{{ __contents[1] }}"
        __resolv: "{{ __contents[2] }}"
        __psa: "{{ __contents[3] | from_yaml }}"
        __audit: "{{ __contents[4] | from_yaml }}"

    - name: Look for the OCFS2 cluster configuration
      ansible.builtin.stat:
        path: /etc/ocfs2/cluster.conf
      register: __molecule_cluster_conf

    - name: Check the playbook ran the ocfs2 role
      ansible.builtin.assert:
        that: __molecule_cluster_conf['stat']['exists']

    - name: Read the mount watchdog timer
      ansible.builtin.command:
        argv: [systemctl, is-active, iscsi-mount-repair-_mnt_watched.timer]
      register: __molecule_timer
      changed_when: false
      failed_when: false

    - name: Check the mount watchdog timer runs
      ansible.builtin.assert:
        that: __molecule_timer['stdout'] == 'active'

    - name: Run the mount watchdog for a mounted path
      ansible.builtin.systemd_service:
        name: iscsi-mount-repair-_mnt_watched.service
        state: started

    - name: Look for a scheduled shutdown
      ansible.builtin.stat:
        path: /run/systemd/shutdown/scheduled
      register: __molecule_shutdown

    - name: Check the watchdog didn't schedule a reboot
      ansible.builtin.assert:
        that: not __molecule_shutdown['stat']['exists']

    - name: Turn Cilium off again
      ansible.builtin.include_role:
        name: pypb.homelab.ubuntu_k3s_node
      vars:
        ubuntu_k3s_node_cilium: false

    - name: Look for the Cilium files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/sysctl.d/99-zzz-override_cilium.conf
        - /etc/modules-load.d/cilium.conf
      register: __molecule_cilium_files

    - name: Check the Cilium files were removed
      ansible.builtin.assert:
        that: __molecule_cilium_files['results'] | selectattr('stat.exists') | length == 0

- name: Verify cloud-init is kept when it wrote the network configuration
  hosts: cloud_init
  gather_facts: false
  tasks:
    - name: Run the role
      block:
        - name: Prepare the node
          ansible.builtin.include_role:
            name: pypb.homelab.ubuntu_k3s_node

        - name: Fail, because the role should have failed
          ansible.builtin.fail:
            msg: The role purged cloud-init although it wrote the network configuration
      rescue:
        - name: Check the role failed for the right reason
          ansible.builtin.assert:
            that: ansible_failed_result['msg'] is search('50-cloud-init.yaml')
