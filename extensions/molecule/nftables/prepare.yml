---
- name: Prepare hosts with another tool's nftables table
  hosts: targets
  gather_facts: false
  tasks:
    # The rules must not reach this machine's own firewall.
    - name: Read the container's network namespace
      ansible.builtin.command:
        argv: [readlink, /proc/1/ns/net]
      register: __molecule_netns
      changed_when: false

    - name: Check the container has its own network namespace
      ansible.builtin.assert:
        that: __molecule_netns['stdout'] != lookup('ansible.builtin.pipe', 'readlink /proc/self/ns/net')

    - name: Install nftables
      ansible.builtin.apt:
        name: nftables
        update_cache: true

    - name: Create a table the role has to leave alone
      ansible.builtin.command:
        argv: [nft, add, table, inet, other]
      changed_when: true
