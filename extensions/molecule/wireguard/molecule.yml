---
platforms:
  - name: wireguard-debian13
    image: docker.io/library/debian:13
  - name: wireguard-ubuntu2404
    image: docker.io/library/ubuntu:24.04
  - name: wireguard-ubuntu2604
    image: docker.io/library/ubuntu:26.04

provisioner:
  name: ansible
  inventory:
    hosts:
      controller:
        hosts:
          molecule-host:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      targets:
        vars:
          # Mesh peers read each other's settings from the inventory.
          wireguard_port: 51337
          wireguard_mesh_endpoint: "{{ ansible_facts['default_ipv4']['address'] }}"
        hosts:
          wireguard-debian13:
            ansible_connection: community.docker.docker
            ansible_user: root
            wireguard_addresses: [10.99.0.1/24]
          wireguard-ubuntu2404:
            ansible_connection: community.docker.docker
            ansible_user: root
            wireguard_addresses: [10.99.0.2/24]
          wireguard-ubuntu2604:
            ansible_connection: community.docker.docker
            ansible_user: root
            wireguard_addresses: [10.99.0.3/24]
  config_options:
    defaults:
      collections_path: ${ANSIBLE_COLLECTIONS_PATH}
      host_key_checking: false
  playbooks:
    create: create.yml
    destroy: destroy.yml

scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - check
    - converge
    - idempotence
    - verify
    - destroy
