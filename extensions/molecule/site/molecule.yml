---
platforms:
  - name: site-debian13
    image: docker.io/library/debian:13
  - name: site-ubuntu2404
    image: docker.io/library/ubuntu:24.04

provisioner:
  name: ansible
  inventory:
    hosts:
      controller:
        hosts:
          molecule-host:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
      targets:
        vars:
          site_chrony: true
          # The containers share the host's clock, which chronyd mustn't change.
          chrony_daemon_opts: -F 1 -x
        hosts:
          site-debian13:
            ansible_connection: community.docker.docker
            ansible_user: root
            site_nftables: true
            nftables_input_rules:
              - tcp dport 22 ct state new accept
          site-ubuntu2404:
            ansible_connection: community.docker.docker
            ansible_user: root
  config_options:
    defaults:
      collections_path: ${ANSIBLE_COLLECTIONS_PATH}
      host_key_checking: false
  playbooks:
    create: create.yml
    destroy: destroy.yml

scenario:
  test_sequence:
    - destroy
    - create
    - check
    - converge
    - idempotence
    - verify
    - destroy
