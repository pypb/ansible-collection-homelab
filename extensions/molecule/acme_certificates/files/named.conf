key "molecule" {
    algorithm hmac-sha256;
    secret "ybQYiKBB7yzZFiWadBSghhjZEtObU+jKRgS4X9nUGb0=";
};

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
};

zone "example.test" {
    type primary;
    file "/var/lib/bind/example.test.zone";
    allow-update { key "molecule"; };
};
