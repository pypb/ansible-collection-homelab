---
# Content from outside this collection that pypb.homelab.site and
# pypb.homelab.k3s_cluster use:
#   ansible-galaxy install -r requirements.yml
# The roles are included when they run, so a role only has to be installed when
# a host enables it. community.zabbix is always needed, since the playbook calls
# its zabbix_host module directly.
roles:
  # site_sshd
  - name: willshersystems.sshd
  # site_docker
  - name: geerlingguy.docker
  # k3s_cluster's k3s step
  - name: xanmanning.k3s

collections:
  # site_zabbix_agent and site_zabbix_host
  - name: community.zabbix
  # site_alloy
  - name: grafana.grafana
